# SeqInputCombinedPosition Documentation

class:
  description: |
    A combined input that behaves exactly as [SeqInputCombinedVector](/classes/seqinputcombinedvector): it applies `Operation` to `LeftSource` and
    `RightSource`. It does not read an object position itself.

    See [SeqInputFloat](/classes/seqinputfloat) for how sequence inputs are read and written.
  notes:
    - "No shipped object uses it."
