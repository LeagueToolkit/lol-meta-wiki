# LogicFloatDriverUpdateViewElements Documentation

class:
  description: |
    A [value binding](/classes/ilogicvaluedriverupdateviewelements) that shows the value of a
    **float driver** in UI elements.
    [ILogicValueDriverUpdateViewElements](/classes/ilogicvaluedriverupdateviewelements)
    describes the update, the displayed value and the modifier chain.
  notes:
    - "Shipped skin HUD view controllers use it to drive the fill of meter, radial and arc elements, often smoothed by an `InterpolateDurationFloatUpdate`, and to drive button states and a text counter."

properties:
  ValueDriver:
    description: "The [float driver](/classes/ilogicfloatdriver) that supplies the target value. It is evaluated on every update for the local player's champion. It must be set: the client does not check for a missing driver."

  ValueUpdateModifiers:
    description: "The [float modifiers](/classes/ifloatupdatemodifier) that move the displayed value toward the target value, run one after the other. If the list is empty, the displayed value follows the target value at once."

  ViewElementsToUpdate:
    description: "The [elements](/classes/ifloatupdateelement) that receive the displayed value, in list order."
