# SeqActionGlobalWindSpeed Documentation

class:
  description: |
    A [SequenceActionLerpFloat](/classes/sequenceactionlerpfloat) for the **global wind speed**.
    It differs from its base only in the output object that it creates by default. That
    default output was not traced. An authored `0xacddc1f1` replaces it.
  notes:
    - "[SeqInputWindSpeed](/classes/seqinputwindspeed), the wind speed input, can be neither read nor written: it always fails. A lerp action that uses it as an input or as its output fails at its start step."
    - "No shipped object uses it."
