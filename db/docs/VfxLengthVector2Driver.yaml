# VfxLengthVector2Driver Documentation

class:
  description: "A [float driver](/classes/ivfxfloatdriver) that returns the length of the vector `Vector2Input`, `sqrt(x² + y²)`. If `Vector2Input` is not set, the driver writes nothing."
  notes:
    - "No shipped object uses it."

properties:
  Vector2Input:
    description: "The vector that is measured."
