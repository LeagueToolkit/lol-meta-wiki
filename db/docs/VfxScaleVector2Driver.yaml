# VfxScaleVector2Driver Documentation

class:
  description: |
    A [Vector2 driver](/classes/ivfxvector2driver) that multiplies both lanes of `Vector2` by
    the [float driver](/classes/ivfxfloatdriver) `ScaleFactor`.

    - The result starts at `(1, 1)`. If `Vector2` is not set, the driver returns `(1, 1)` and
      does not evaluate `ScaleFactor`.
    - If `ScaleFactor` is not set, the driver returns `Vector2` unscaled.
  notes:
    - "No shipped object uses it."

properties:
  Vector2:
    description: "The vector that is scaled."

  ScaleFactor:
    description: "The factor of every lane."
