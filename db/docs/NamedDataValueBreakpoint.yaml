# NamedDataValueBreakpoint Documentation

class:
  description: "A level at which a [ByCharLevelNamedDataValueBreakpointsCalculationPart](/classes/bycharlevelnameddatavaluebreakpointscalculationpart) changes its bonus per level and adds a flat amount. It is the data-value form of [Breakpoint](/classes/breakpoint)."

properties:
  level:
    description: "The champion level of the breakpoint. Both changes apply from this level."

  AdditionalBonusAtThisLevelDataValue:
    description: "Name of the data value that gives the flat amount added once from this level."

  BonusPerLevelAtAndAfterDataValue:
    description: "Name of the data value that gives the bonus per level from this level on, including this level."
