# MusicProfile Documentation

class:
  description: |
    The **music event set of a game mode**: the champion music and theme music events that
    the [AudioGlobalEventManager](/classes/audioglobaleventmanager) triggers for game
    events.

    A profile is a game mode config. A mode names its profile in
    `GameModeMapData.MusicProfile`. When the client initialises the profile, the profile
    hands itself to the active manager, which keeps it as the one active profile and
    subscribes its two event tables together with the manager's own announcer table.

    A profile needs a manager. If no `AudioGlobalEventManager` object is loaded, the client
    logs an error and the profile does nothing.

    The client triggers the events of an active profile but plays no sound for them.
    `AudioGlobalEventManager` describes where the chain stops.
  notes:
    - "No shipped bin contains an object of this class. The behaviour is read from the client and is not tested in game."

properties:
  ChampionMusicEvents:
    description: |
      The champion music event table: one [ChampionMusicEvent](/classes/championmusicevent)
      link per game event.

  ThemeMusicEvents:
    description: |
      The theme music event table: one [ThemeMusicEvent](/classes/thememusicevent) link per
      game event. See [ThemeMusicEvents](/classes/thememusicevents).

  MusicQueueConfigs:
    description: |
      The [AudioQueueConfig](/classes/audioqueueconfig) objects for music events, as an
      [AudioQueueConfigList](/classes/audioqueueconfiglist). The client does not read them.

  "0x93c1d30":
