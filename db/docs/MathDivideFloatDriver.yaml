# MathDivideFloatDriver Documentation

class:
  description: |
    Returns `value ÷ Denominator`. See [MathFloatDriver](/classes/mathfloatdriver).

    The driver never divides by zero. When `Denominator` is within one billionth of `0`, it
    returns `0` and does not evaluate `value`.

    Its usual job is to turn a raw count into the `0` to `1` fill of a meter. Sett's grit
    meter divides a
    [BuffCounterDynamicMaterialFloatDriver](/classes/buffcounterdynamicmaterialfloatdriver)
    by a [SpellDataNamedValueFloatDriver](/classes/spelldatanamedvaluefloatdriver) inside a
    [LogicDriverViewController](/classes/logicdriverviewcontroller).

properties:
  Denominator:
    description: "The driver `value` is divided by. It must be set."
