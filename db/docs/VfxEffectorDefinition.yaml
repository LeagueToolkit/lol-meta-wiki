# VfxEffectorDefinition Documentation

class:
  description: |
    Attaches an **environment effector** to a particle system: a moving force applied
    to a map-wide environment field rather than to the system's own particles. Held by
    [VfxSystemDefinitionData](/classes/vfxsystemdefinitiondata) through its
    `EffectorDefinition` property.

    The effector force is bound to the system instance for the duration of its
    lifetime. The linked effector data describes its shape and physical properties,
    which are used for surface displacement.
  notes:
    - "Patch 16.21 on PBE removes this class and the effector classes that it links. [VfxEffectorComponent](/classes/vfxeffectorcomponent), a component of one emitter, replaces it."
    - "A system creates a handle for its effector when it spawns, but nothing in the client collects those handles, so the effector has no effect."

properties:
  EffectorData:
    description: |
      Link to the [environment effector](/classes/environmenteffectorbase) this system
      contributes, carrying its shape, its strength and its decay time.
