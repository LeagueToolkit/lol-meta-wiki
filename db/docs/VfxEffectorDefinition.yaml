# VfxEffectorDefinition Documentation

class:
  description: |
    Attaches an **environment effector** to a particle system: a moving force applied
    to a map-wide environment field rather than to the system's own particles. Held by
    [VfxSystemDefinitionData](/classes/vfxsystemdefinitiondata) through its
    `EffectorDefinition` property.

    When a system carrying one is spawned, the engine allocates a handle binding the
    effector to that system instance, and releases it when the system is torn down, so
    the force exists for exactly as long as the effect does.

    The effector it links describes a shape - a travelling wake, a spinning burst, a
    constant-width beam, or a band tapering between two widths - together with a
    strength and a decay time. The field consumer reads the shape, its world position,
    the strength, and how far the effector has decayed, and displaces the surface the
    shape covers.
  notes:
    - "Nothing gathers effectors in current builds. The registry an effector adds itself to on creation is never created, so the list is never read, and no shader in the game binds the environment-effector field the result would be written into. The data path exists end to end and is inert."
    - "No shipped effect links an effector."

properties:
  "0x399a1c39":
    description: |
      The effector attached to this system: a link to the shape definition carrying the
      effector's strength and decay timing.
