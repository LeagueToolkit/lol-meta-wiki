# 0x20946fd8 Documentation

class:
  description: |
    A death behaviour for `definition` of [DeathGeComponentDef](/classes/deathgecomponentdef).
    The client does not read it. When the entity dies or respawns, the client does nothing with
    this object. [IDeathGeComponentDef](/classes/ideathgecomponentdef) describes the death
    component.
  notes:
    - "No shipped object uses it."
