# VfxBurstEffectorComponentRuntime Documentation

class:
  description: |
    The running part of an effector with the burst shape. A
    [VfxBurstEffectorComponentData](/classes/vfxbursteffectorcomponentdata) object creates it. What it stores is on
    [VfxEffectorComponentRuntime](/classes/vfxeffectorcomponentruntime).
  notes:
    - "The client creates this object itself. A bin does not hold it."
