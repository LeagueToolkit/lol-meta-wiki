# TftIsEnemyMaterialBoolDriver Documentation

class:
  description: |
    A [bool driver](/classes/ilogicbooldriver) that tells **whether a Teamfight Tactics board
    unit is an enemy** from the view of the local player. On a board, the team of a unit
    does not say whose side it is on, because the board can belong to the local player or
    to another player whom the local player visits. The driver accounts for that:

    | The local player watches | Returns `true` for |
    |---|---|
    | their own board | units whose team is not `100` |
    | another player's board | units of team `100` |

    The driver returns `false` when the source is not a board unit, and in game modes other
    than the Teamfight Tactics modes it supports.
  notes:
    - "Shipped data uses it in Teamfight Tactics status-effect materials, as the condition of a [ColorChooserMaterialDriver](/classes/colorchoosermaterialdriver)."
    - "For other game modes, see [IsEnemyDynamicMaterialBoolDriver](/classes/isenemydynamicmaterialbooldriver)."
