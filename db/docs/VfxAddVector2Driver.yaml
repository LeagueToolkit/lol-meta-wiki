# VfxAddVector2Driver Documentation

class:
  description: |
    A [Vector2 driver](/classes/ivfxvector2driver) that returns the lane-by-lane sum of the
    drivers in `params`. The Vector2 form of [VfxAddFloatDriver](/classes/vfxaddfloatdriver).

    The sum starts at `(0, 0)`, so an empty list returns `(0, 0)`. The driver skips an entry
    that is not set.
  notes:
    - "No shipped object uses it."

properties:
  params:
    description: "The operands, added in list order."
