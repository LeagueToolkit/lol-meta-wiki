# VfxVector2AnimatedWithRandomByFactorDriver Documentation

class:
  description: "A [Vector2 driver](/classes/ivfxvector2driver) that samples the embedded curve `Vector2` at the value of the [float driver](/classes/ivfxfloatdriver) `Factor`. The Vector2 form of [VfxFloatAnimatedWithRandomByFactorDriver](/classes/vfxfloatanimatedwithrandombyfactordriver)."
  notes:
    - "No shipped object uses it."

properties:
  Vector2:
    description: "The curve, a `ValueVector2`. If it has no animation, the driver returns its constant value."

  Factor:
    description: "The position on the curve. If it is not set, the curve is sampled at `0`."

  ShareRandom:
    description: "When `true`, both lanes read one random value. When `false`, each lane reads its own random value."
