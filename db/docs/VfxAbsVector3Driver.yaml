# VfxAbsVector3Driver Documentation

class:
  description: "A [Vector3 driver](/classes/ivfxvector3driver) that returns the absolute value of each lane of `Param`. The Vector3 form of [VfxAbsFloatDriver](/classes/vfxabsfloatdriver). If `Param` is not set, the driver returns `(0, 0, 0)`."
  notes:
    - "No shipped object uses it."

properties:
  Param:
    description: "The input vector."
