# VfxFacingModeCameraAligned Documentation

class:
  description: |
    A [facing mode](/classes/vfxshimmerfacingmode) that turns each particle toward the
    camera's position. Forward runs from the particle to the camera, and up is the camera's
    up vector, so the particle rolls with the camera. A mesh points its local +Z at the
    camera.

    The particle's own rotation is applied inside that frame.
