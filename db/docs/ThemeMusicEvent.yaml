# ThemeMusicEvent Documentation

class:
  description: |
    The **theme music cue for one game event**. A slot of
    [ThemeMusicEvents](/classes/thememusicevents) links it. When the game event of the slot
    arrives, the [AudioGlobalEventManager](/classes/audioglobaleventmanager) triggers this
    object, and the object passes the trigger to its `ThemeMusicEventType`.

    A theme music event plays no sound in the current client. The trigger of
    [ThemeMusicEventTypeGeneric](/classes/thememusiceventtypegeneric) is empty, and the
    trigger of the other concrete type, [0x58a4ecbd](/classes/0x58a4ecbd), reads neither of
    its two event names.
  notes:
    - "No shipped bin contains an object of this class. The behaviour is read from the client and is not tested in game."

properties:
  ThemeMusicEventType:
    description: |
      The object that decides which audio event name the cue uses. The client copies the
      event's `objectPath` and `NameHash` into this object.
