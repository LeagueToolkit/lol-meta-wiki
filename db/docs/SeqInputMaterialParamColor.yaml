# SeqInputMaterialParamColor Documentation

class:
  description: |
    A [color input](/classes/seqinputcolor) for the **sequence material color stored under the key `Parameter`**.

    - A read returns the value of the first object in `Objects` that has sequence material values.
    - A write sets the value on every object in `Objects` that has sequence material values.

    The read fails if no object in `Objects` has sequence material values. An unset `Objects` matches no object.

    [SequenceMaterialVectorDriver](/classes/sequencematerialvectordriver) reads sequence material colors and links the same kind of key object.

    See [SeqInputFloat](/classes/seqinputfloat) for how sequence inputs are read and written.
  notes:
    - "No shipped object uses it."

properties:
  Parameter:
    description: "The key of the value. It must be set: the client does not check for a missing key."

  Objects:
    description: "The objects whose value is read and written. Objects without sequence material values are skipped."
