# SequenceActionCurveFloat Documentation

class:
  description: |
    A [sequence action](/classes/isequenceaction) that **drives a number along a curve** over
    the duration of the action and writes it to `CurveValue`. The action has a start step and
    an update step and no stop step. Their code was not traced, so the time base of the curve
    (seconds or progress) is not documented.
  notes:
    - "No shipped object uses it."

properties:
  FloatCurve:
    description: "The curve of the value. See [CurveFloat](/classes/curvefloat)."

  CurveValue:
    description: "The output: the input that receives the value of the curve."
