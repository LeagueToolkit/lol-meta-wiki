# SeqActionLightIntensityScale Documentation

class:
  description: |
    A [SequenceActionLerpFloat](/classes/sequenceactionlerpfloat) for the **intensity scale of a
    light**. It differs from its base only in the output object that it creates by default.
    That default output was not traced. An authored `0xacddc1f1` replaces it.
  notes:
    - "[SeqInputLightIntensityScale](/classes/seqinputlightintensityscale) is the input that reads and writes the intensity scale of light objects."
    - "No shipped object uses it."
