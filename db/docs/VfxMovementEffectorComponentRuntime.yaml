# VfxMovementEffectorComponentRuntime Documentation

class:
  description: |
    The running part of an effector with the movement shape. A
    [VfxMovementEffectorComponentData](/classes/vfxmovementeffectorcomponentdata) object creates it. What it stores is on
    [VfxEffectorComponentRuntime](/classes/vfxeffectorcomponentruntime).
  notes:
    - "The client creates this object itself. A bin does not hold it."
