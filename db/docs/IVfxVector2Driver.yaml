# IVfxVector2Driver Documentation

class:
  description: |
    A [VFX driver](/classes/ivfxbasedriver) that returns a **two-component vector**. A vector2
    value of the component VFX system is a
    [VfxVector2DynamicProperty](/classes/vfxvector2dynamicproperty) that holds the top node of
    the expression. [IVfxBaseDriver](/classes/ivfxbasedriver) describes when values are
    evaluated, how random values are assigned and the time source and comparator values.
