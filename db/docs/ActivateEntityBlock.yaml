# ActivateEntityBlock Documentation

class:
  description: |
    A [game entity block](/classes/gameentityblock) that **activates** the `Target` entity. If the
    entity is already active, the block does nothing.
  notes:
    - "The block evaluates `ShowDuration` even when `ActivateThenShow` is false, and then ignores it."
    - "No shipped object uses it."

properties:
  ActivateThenShow:
    description: "If true, the entity starts a show over `ShowDuration` after it is activated. If false, the entity is activated without a show."
  ShowDuration:
    description: "Duration of the show, in seconds. Used only when `ActivateThenShow` is true."
  Target:
    description: "The entity to activate."
