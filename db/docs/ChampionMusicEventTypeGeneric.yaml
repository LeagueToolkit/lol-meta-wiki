# ChampionMusicEventTypeGeneric Documentation

class:
  description: |
    A champion music event type with **one cue for every listener**. For the local player,
    the client tests whether `GenericEvent` is set and does nothing else.
    [AudioContextEventType](/classes/audiocontexteventtype) describes where the chain
    stops.
  notes:
    - "No shipped bin contains an object of this class. The behaviour is read from the client and is not tested in game."

properties:
  GenericEvent:
    description: "The cue name for every listener."

  PriorityBehavior:
    description: "The [AudioPriorityBehavior](/classes/audioprioritybehavior) of the cue. The client does not read it."
