# ConditionFloatPairData Documentation

class:
  description: |
    One range of a [ConditionFloatClipData](/classes/conditionfloatclipdata): a bound, the
    child that plays in that range, and how long the clip stays on this child after the
    value has left the range.

properties:
  mValue:
    description: |
      The bound of the range, in the unit of the clip's `Updater`. For values of `0` or
      more it is the lower bound of the range. For values below `0` it is the upper bound.
      See `ConditionFloatClipData.mConditionFloatPairDataList`.

  mClipName:
    description: |
      The child that plays in this range, as a key of `AnimationGraphData.mClipDataMap`.
      An empty name, or a name that is not in the map, plays nothing in this range and
      leaves the child that plays.

  mHoldAnimationToLower:
    description: |
      How long the clip stays on this child after the value has moved to a **lower** range,
      in seconds. While the time runs, the clip keeps choosing this child, so it keeps
      playing. When the time is over, `ConditionFloatClipData.mChildAnimDelaySwitchTime`
      starts, so the two add up.

      - The time counts only while the value is outside this range. If the value comes
        back before the time is over, the count stops and this child plays on. The next
        time the value leaves, the hold starts again from the full value.
      - If the value moves on to a third range while the hold runs, the hold is not
        started again.
      - "Lower" compares the `mValue` of the two entries, not the value itself.

      `0` switches at once.
    notes:
      - "The hold time is taken from the entry that is left, not from the entry that is entered."
      - "Holds work only with `ConditionFloatClipData.mChangeAnimationMidPlay`. Without it the clip chooses a child only once."
      - "A hold belongs to one run of the clip. When the clip, or a clip above it, is played again, the new run starts with no hold."
      - "If this child is not looping and ends while the hold runs, it does not stay on its last frame. A clip that loops starts again and keeps choosing this child, so the child plays again from its start until the hold is over. A clip that does not loop ends with the child."

  mHoldAnimationToHigher:
    description: |
      How long the clip stays on this child after the value has moved to a **higher**
      range, in seconds. It works like `mHoldAnimationToLower`.
    notes:
      - "Shipped data has values such as `450` and `1000` here. They hold for that many seconds, which in practice is until the clip ends."
