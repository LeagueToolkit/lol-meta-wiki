# VfxVector3LogicDriver Documentation

class:
  description: "A [Vector3 driver](/classes/ivfxvector3driver) that returns the value of the [logic driver](/classes/ilogicvector3driver) `LogicDriver`. The Vector3 form of [VfxFloatLogicDriver](/classes/vfxfloatlogicdriver), which describes when the logic driver is evaluated."
  notes:
    - "No shipped object uses it."

properties:
  LogicDriver:
    description: "The logic driver that gives the value."

  Source:
    description: "Selects the object that the logic driver is evaluated for. [VfxFloatLogicDriver](/classes/vfxfloatlogicdriver) describes the values."
