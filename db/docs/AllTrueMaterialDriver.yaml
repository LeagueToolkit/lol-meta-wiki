# AllTrueMaterialDriver Documentation

class:
  description: |
    A [bool driver](/classes/ilogicbooldriver) that is true when **every driver in
    `mDrivers` is true**: a logical AND. It is the usual way to combine several conditions,
    for example "the unit is alive and has the buff".

    The driver evaluates every entry on every evaluation, even after an entry is false. A
    stateful operand, such as [DelayedBoolMaterialDriver](/classes/delayedboolmaterialdriver),
    therefore advances on every evaluation.
  notes:
    - "An entry that is not set is skipped. It counts as neither true nor false."
    - "With an empty list, or a list of only unset entries, the driver returns `true`."
    - "To test that a condition is false, wrap it in a [NotMaterialDriver](/classes/notmaterialdriver)."

properties:
  mDrivers:
    description: "The conditions. The driver returns `true` only when all of them return `true`."
