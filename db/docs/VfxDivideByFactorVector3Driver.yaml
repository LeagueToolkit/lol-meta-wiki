# VfxDivideByFactorVector3Driver Documentation

class:
  description: |
    A [Vector3 driver](/classes/ivfxvector3driver) that divides all three lanes of `Vector3` by
    the [float driver](/classes/ivfxfloatdriver) `Divisor`. The Vector3 form of
    [VfxDivideByFactorFloatDriver](/classes/vfxdividebyfactorfloatdriver).

    - The result starts at `(1, 1, 1)`. If `Vector3` is not set, the driver returns `(1, 1, 1)`
      and does not evaluate `Divisor`.
    - If `Divisor` is not set, or it is within `1e-6` of zero, the driver returns `Vector3`
      unchanged.
  notes:
    - "No shipped object uses it."

properties:
  Vector3:
    description: "The dividend."

  Divisor:
    description: "The divisor of every lane."
