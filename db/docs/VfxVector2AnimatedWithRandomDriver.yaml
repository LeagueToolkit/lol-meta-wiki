# VfxVector2AnimatedWithRandomDriver Documentation

class:
  description: "A [Vector2 driver](/classes/ivfxvector2driver) that samples the embedded curve `Vector2` at a time source. The Vector2 form of [VfxFloatAnimatedWithRandomDriver](/classes/vfxfloatanimatedwithrandomdriver), which describes the sampling and the random variation."
  notes:
    - "No shipped object uses it."

properties:
  Vector2:
    description: "The curve, a `ValueVector2`. If it has no animation, the driver returns its constant value."

  frequency:
    description: "The time source that the curve is sampled at. [IVfxBaseDriver](/classes/ivfxbasedriver) lists the values."

  looping:
    description: "When `true`, a time past the end of the curve wraps back to its start."

  ShareRandom:
    description: "When `true`, both lanes read one random value. When `false`, each lane reads its own random value."
