# VfxComponentBase Documentation

class:
  description: |
    The root of the **component classes** that make up a
    [VfxComponents](/classes/vfxcomponents) graph. Each component fills one slot of that graph:
    lifetime, physics, render or geometry, plus the optional child component. A component that
    fits none of the slots, such as [VfxLightComponent](/classes/vfxlightcomponent),
    [VfxEffectorComponent](/classes/vfxeffectorcomponent) or
    [VfxAudioComponent](/classes/vfxaudiocomponent), goes in the graph's `components` list. The
    graph's page describes what each slot does and the order in which the slots run.

    A component is a definition shared by every instance of its system. The client uses it at
    two points:

    - When the system is prepared, the component reserves the random values and the driver
      storage that its drivers need. The geometry and child components skip this step.
    - When a system instance creates the emitter, the component creates its running part, an
      [IVfxRuntime](/classes/ivfxruntime) object, and declares the per-particle values that the
      running part stores. The running part holds all per-instance state.
  notes:
    - "Shipped data uses only the modern components, never the `VfxLegacy*` ones."
