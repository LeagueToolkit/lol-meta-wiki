# VfxComponentBase Documentation

class:
  description: |
    The root of the **component classes** that make up a
    [VfxComponents](/classes/vfxcomponents) graph. Each component fills one slot of that graph:
    lifetime, physics, render or geometry, plus the optional child component. The graph's page
    describes what each slot does and the order in which the slots run. A component that
    fits none of the slots, such as [VfxLightComponent](/classes/vfxlightcomponent), goes in
    the graph's `components` list.

    Shipped data uses only the modern components, never the `VfxLegacy*` ones.
