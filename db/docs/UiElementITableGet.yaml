# UiElementITableGet Documentation

class:
  description: |
    A getter that reads a script variable that holds a UI element. The variable must hold
    a UiElement value. Otherwise, or if the variable does not exist, the getter fails with
    a script error. See [ScriptTableGet](/classes/scripttableget) for `Table` and `Var`.
  notes:
    - "No shipped object uses it."
