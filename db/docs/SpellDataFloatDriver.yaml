# SpellDataFloatDriver Documentation

class:
  description: |
    The shared part of the [float drivers](/classes/ilogicfloatdriver) that read a value out
    of a **spell's data**. The spell is named by a link, not by a spellbook slot.

    These drivers read the static data of a spell, such as its values per level. For "is
    this spell being cast", see [IsCastingBoolDriver](/classes/iscastingbooldriver).

properties:
  Spell:
    description: |
      The spell object whose data is read. The driver resolves it on its first evaluation and
      keeps the result.
    notes:
      - "The link must resolve to a loaded spell object. See the crash note on [SpellDataNamedValueFloatDriver](/classes/spelldatanamedvaluefloatdriver)."
