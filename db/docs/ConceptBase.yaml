# ConceptBase Documentation

class:
  description: |
    Root of the **Concept** system: a concept is a named value channel that
    decouples the producer of a gameplay value from its consumers. Script
    blocks write concepts (see
    [ConceptBlockBase](/classes/conceptblockbase)), and the logic-driver graph
    reads them back through the `Raw*`/`Eased*ConceptLogicDriver` classes (see
    [RawFloatConceptLogicDriver](/classes/rawfloatconceptlogicdriver)), from
    where the value can reach materials, animation conditions, VFX, and
    [driver-driven UI](/classes/logicdriverviewcontroller). Neither end names
    the other: both address the channel by its `PathHash`.

    Concepts exist per value type - [BoolConcept](/classes/boolconcept),
    [IntConcept](/classes/intconcept), [FloatConcept](/classes/floatconcept),
    [Vector3Concept](/classes/vector3concept),
    [Vector4Concept](/classes/vector4concept) - each carrying a typed default
    that the `Raw*` readers see until the value is first written, and optional
    easing ([ConceptEasingData](/classes/concepteasingdata)) that smooths
    changes for the `Eased*` readers. A concept holds one value per object it
    is written for.

properties:
  PathHash:
    description: "The concept's identity - the hash writers and readers use to address this channel."
