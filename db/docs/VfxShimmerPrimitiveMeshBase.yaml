# VfxShimmerPrimitiveMeshBase Documentation

class:
  description: |
    The component **mesh** primitives. Each particle draws a whole mesh, one particle at a
    time; meshes are never batched.

    **Which mesh.** When the system is prepared, the client loads what `Mesh` names: the
    skinned pair with its animation, and a static mesh chosen by the extension of
    `mSimpleMeshName`. At draw time a `.scb` wins over a `.tmesh` or `.gmesh`, and either wins
    over a skinned mesh. When the attached mesh's own `Mesh` loads nothing, it draws the
    owner's skinned mesh; see
    [VfxShimmerPrimitiveAttachedMesh](/classes/vfxshimmerprimitiveattachedmesh). Whether a
    plain component mesh draws its own skinned `.skn` mesh is not yet identified.

    **Orientation.** Without a `FacingMode`, the mesh takes the particle's orientation and is
    not turned toward the camera. Component meshes have no `AlignYawToCamera` or
    `AlignPitchToCamera` flags, so the camera alignment of
    [legacy meshes](/classes/vfxprimitivemeshbase) stays off.

properties:
  Mesh:
    description: |
      The mesh to draw, in the same form legacy mesh primitives use; see
      [VfxMeshDefinitionData](/classes/vfxmeshdefinitiondata).
    notes:
      - "Every shipped component mesh names a `.gmesh` in `mSimpleMeshName` and sets nothing else here."

  FacingMode:
    description: |
      Turns each particle toward the camera. The facing mode chosen decides how; see
      [VfxShimmerFacingMode](/classes/vfxshimmerfacingmode). When it is unset, the mesh keeps
      the particle's orientation. Instanced mesh draws pass the facing mode to the shader.
    notes:
      - "If a static mesh (`.scb`, `.tmesh` or `.gmesh`) sets a facing mode, the per-particle mesh draw loses the particle's position and draws the mesh at the world origin. The facing rotation replaces the particle's transform, and the position is not restored. Skinned meshes keep the position. A [VfxFacingModeCameraFacingDirectionOriented](/classes/vfxfacingmodecamerafacingdirectionoriented) mode with no direction of travel leaves the transform unchanged, so it keeps the position too."
      - "No shipped mesh sets it."
