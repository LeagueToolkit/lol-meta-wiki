# TargetTypeFilter Documentation

class:
  description: |
    A [stat stone event filter](/classes/istatstonelogicdriver) that passes when the
    **target unit** of the event is of a type whose flag is set.
    [IStatStoneLogicDriver](/classes/istatstonelogicdriver) describes the unit type test. A
    kind of event that has no target fails. The filter does not set the amount.

properties:
  ChampionsAreValid:
    description: "A champion target passes."

  MinionsAreValid:
    description: "A minion target passes."

  TurretsAreValid:
    description: "A turret target passes."
