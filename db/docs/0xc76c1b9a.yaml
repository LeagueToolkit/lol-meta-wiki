# 0xc76c1b9a Documentation

class:
  description: |
    Parameter [override](/classes/0xa41315c0) that eases into its value rather than
    snapping to it. On installation it takes over the override it displaced and asks
    it for the parameter's current value, using that as the start of the blend - so
    installing a second blend while the first is still running continues from wherever
    the first had reached instead of jumping back.
  notes:
    - "All shipped data leaves `duration` and `EasingType` unset, so every authored override in the game is in practice an instant swap and the easing path ships unused."

properties:
  duration:
    description: "Length of the blend, in seconds. At the default the blend completes immediately, making the override an instant swap."

  EasingType:
    description: "Curve used to interpolate from the displaced value to this override's value across `duration`."
