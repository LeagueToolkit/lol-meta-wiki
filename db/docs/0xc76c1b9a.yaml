# 0xc76c1b9a Documentation

class:
  description: |
    Parameter [override](/classes/0xa41315c0) that eases into its value rather than
    snapping to it. It takes ownership of the override it displaces and starts from
    that override's current value, so a blend installed while another is still running
    continues from where the previous one had reached instead of jumping back.

properties:
  duration:
    description: "Length of the blend, in seconds. At the default the blend completes immediately, making the override an instant swap."

  EasingType:
    description: "Curve used to interpolate from the displaced value to this override's value across `duration`."
