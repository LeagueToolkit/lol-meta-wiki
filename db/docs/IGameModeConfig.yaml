# IGameModeConfig Documentation

class:
  description: |
    The kind of per-mode config that a mode links from `GameModeMapData.Configs`.
    [IGameModeConfigBase](/classes/igamemodeconfigbase) explains how the client finds a
    config and what a missing one means.

    The client does not treat these differently from an
    [IGameModeConfigClient](/classes/igamemodeconfigclient): objects from both lists go into
    the same table and are looked up the same way.
