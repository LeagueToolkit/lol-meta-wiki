# VfxPrimitiveLaser Documentation

class:
  description: |
    Batched geometry between two points, built on the CPU in every update through the
    geometry builder of the [component primitives](/classes/vfxshimmerprimitivebase). Only
    the component VFX system builds it. The number of vertices and indices each particle gets
    follows from the two segment counts in `Laser`; see
    [VfxLaserDefinitionData](/classes/vfxlaserdefinitiondata).

    The laser has no facing mode.
  notes:
    - "No shipped data uses this class."

properties:
  Laser:
    description: "Endpoints and tessellation of the laser. See [VfxLaserDefinitionData](/classes/vfxlaserdefinitiondata)."
