# LogicDriverViewEntry Documentation

class:
  description: |
    One view of a
    [LogicDriverViewController](/classes/logicdriverviewcontroller): a UI
    scene plus the **driver bindings** that animate it. A view entry can gate
    the whole scene, gate individual elements, drive meter-style values, and
    substitute driver-computed numbers into element text.

    All driver pointers accept any driver of the `ILogicDriver` family,
    including compositions (`AllTrueMaterialDriver`, `NotMaterialDriver`,
    `FloatComparisonMaterialDriver`, `MathDivideFloatDriver`, ...). The
    shipped Soul Fighter Sett overlay uses every mechanism listed here.

properties:
  Scene:
    description: "Hash of the UI scene this view controls."
  EnableCondition:
    description: |
      Bool driver gating the whole scene. Sett's overlay uses
      `AllTrueMaterialDriver { NotMaterialDriver { IsDeadDynamicMaterialBoolDriver }, ... }` -
      hide when dead, show when the resource is active.
  TransitionOnState:
    description: "Hash of the scene state to play when `EnableCondition` turns true."
  TransitionOffState:
    description: "Hash of the scene state to play when `EnableCondition` turns false."
  ConditionalElementsEntries:
    description: "Legacy list of [LogicDriverConditionalElementsEntry](/classes/logicdriverconditionalelementsentry), superseded by `0x9f6debf3`."
  "0x9f6debf3":
    description: |
      Per-element visibility:
      [LogicDriverConditionalElementsEntry](/classes/logicdriverconditionalelementsentry)
      embeds, each pairing a list of element hashes with its own
      `EnableCondition` bool driver. Sett's overlay gates each meter pip with a
      `FloatComparisonMaterialDriver` against the grit count here.
  LogicDriverElementUpdates:
    description: |
      Value bindings. Each is a
      [LogicFloatDriverUpdateViewElements](/classes/logicfloatdriverupdateviewelements)
      (or its vector sibling `LogicDriverUpdateViewElements`): a `ValueDriver`
      (float driver), an optional modifier list (`0x7a721423`, e.g. an
      `InterpolateDurationFloatUpdate` whose `DurationDriver` smooths the value
      over time), and the elements that display the value
      (`ViewElementsToUpdate`). This is how a float driver becomes a **meter
      fill** - Sett's grit meter binds
      `MathDivideFloatDriver(BuffCounter / SpentGritThreshold)` here.
  "0x40c7c429":
    description: |
      Element entries (class `LogicDriverElementTooltip`): `element: hash`,
      `ElementAnchor: u8`, tooltip content, and a text-binding list
      (`0xa620b98f` of `0xD5C5318A`). Each text binding pairs a placeholder
      token (`Key`, e.g. `"@CurrentGrit@"`) with a text source
      (`LogicDriverFloatToString`): a `ValueDriver` plus a printf-style
      `TextFormat` (e.g. `"%01.0f"`). The formatted driver value replaces the
      placeholder in the element's localized text - **driver-driven numbers in
      UI text**. A static-string source (`0x9A7DE981`, `value: string`)
      supplies plain TRA-key text for the same slots, and a
      `LogicDriverValueToStringArray` picks one text source from a list by a
      driver-computed index.
  LogicDriverElementMaterialSource:
    description: |
      Material-driver entries (class `0x75A22C3`): carry an
      `IMaterialLogicDriverSource` pointer, feeding the logic-driver graph
      into **dynamic material parameters on UI elements** - the same
      mechanism `DynamicMaterialDef` uses on skins.
