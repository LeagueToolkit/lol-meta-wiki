# ValueVector2 Documentation

class:
  description: |
    An **animated two-component value**: a constant plus an optional curve. It evaluates as
    [ValueFloat](/classes/valuefloat) does, per component. Emitters use it for UV values such
    as `birthUVOffset`, `uvScale` and `birthUvScrollRate`.
  notes:
    - "[IntegratedValueVector2](/classes/integratedvaluevector2) is the same value with its curve replaced by the curve's integral at load."

properties:
  constantValue:
    description: "The value when `dynamics` is not set. With a `VfxAnimated*` curve it multiplies the curve per component. With a `VfxAnimated*VariableData` curve it is not used."

  dynamics:
    description: "The curve. See [ValueFloat](/classes/valuefloat) for how its type changes the result."
