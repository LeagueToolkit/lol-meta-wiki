# SeqActionRotateObject Documentation

class:
  description: |
    A [sequence action](/classes/isequenceaction) that **rotates an object** from `StartValue`
    to `EndValue` over the duration of the action. Its properties follow
    [SequenceActionLerpVector](/classes/sequenceactionlerpvector), with `TargetObject` in place
    of an output input. The action has a start step and an update step and no stop step. Their
    code was not traced, so the angle unit is not documented.
  notes:
    - "No shipped object uses it."

properties:
  TargetObject:
    description: "The object to rotate."

  StartValue:
    description: "The rotation at progress `0`."

  EndValue:
    description: "The rotation at progress `1`."

  UseInitialStart:
    description: "When `true`, `StartValue` is read once at the start."

  UseInitialEnd:
    description: "When `true`, `EndValue` is read once at the start."

  EasingType:
    description: "The curve applied to the progress. See the `EasingType` table on [ISequenceAction](/classes/isequenceaction)."
