# IsOptionEnabledBoolDriver Documentation

class:
  description: |
    A [bool driver](/classes/ilogicbooldriver) that returns the current value of one of the
    player's **game settings** that is a checkbox. It does not use the source, so inside a
    per-unit material it acts as one switch for every unit.

    For a setting that is a slider, see
    [GetFloatOptionFloatDriver](/classes/getfloatoptionfloatdriver).
  notes:
    - "Shipped UI data uses it inside a [NotMaterialDriver](/classes/notmaterialdriver), always with the index `49`, which is not in the table below."

properties:
  option:
    description: |
      The index of the setting. `65535`, the default, means no setting, and the driver
      returns `false`.

      | Index | Setting | Index | Setting |
      |---|---|---|---|
      | `1` | `AlwaysShowExtendedTooltip` | `4` | `AutoDisplayTarget` |
      | `6` | `ClampCastTargetLocationWithinMaxRange` | `22` | `EnableChampionSpellPreview` |
      | `24` | `EnableChat` | `30` | `EnableGlobalSpellCastNotifications` |
      | `32` | `EnableItemComponentPurchasing` | `39` | `EnableScoutAheadPopOut` |
      | `40` | `EnableScreenShake` | `43` | `FlashScreenWhenDamaged` |
      | `44` | `FlashScreenWhenStunned` | `46` | `HidePlayerNames` |
      | `47` | `HideEnemySummonerEmotes` | `50` | `HideReciprocityFist` |
      | `54` | `ScrollSmoothingEnabled` | `55` | `MiddleClickDragScrollEnabled` |
      | `56` | `MinimapMoveSelf` | `57` | `MinimapEnableAllTimers` |
      | `58` | `MinimizeCameraMotion` | `72` | `BootsPanelPinned` |
      | `73` | `ConsumablesPanelPinned` | `74` | `InventoryPanelPinned` |
      | `75` | `InvertDisplayOrder` | `76` | `ShowAllChannelChat` |
