# VfxAttachedBoneScaleDriver Documentation

class:
  description: |
    A [Vector3 driver](/classes/ivfxvector3driver) with no inputs. It returns a vector that the
    client stores on the particle system and refreshes once per frame from the skeleton of the
    object that owns the system: three floats of the record of one joint of that skeleton. The
    value is `(1, 1, 1)` until the client writes it.

    Which joint the client reads, and whether the three floats are the scale of that joint, is
    not yet confirmed.
  notes:
    - "No shipped object uses it."
