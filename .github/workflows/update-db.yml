name: Update Meta DB

on:
  # Pushed by LeagueToolkit/lol-meta-classes as soon as its db/ moves, so a new
  # build reaches the site in minutes rather than waiting for the cron.
  # `meta-db-updated` is a push that changed db/meta.db.json (a new live
  # build). `meta-pbe-updated` is a push that changed only the PBE overlay,
  # db/meta.pbe.json, which happens on most days of a PBE cycle.
  repository_dispatch:
    types: [meta-db-updated, meta-pbe-updated]

  # Fallback for a missed or unauthenticated dispatch (expired token, failed
  # upstream run). Weekly, shortly after lol-meta-classes' Sunday sync.
  schedule:
    - cron: '0 6 * * 0'

  workflow_dispatch:

# Serialize the runs: two dispatches that arrive close together must not race
# their pushes. The second run then finds nothing left to commit.
concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the explicit deploy trigger below.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Both files come from one upstream commit (see scripts/update-db.ts).
      - name: Fetch latest meta.db.json and meta.pbe.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-db.ts

      - name: Commit and push if changed
        id: commit
        run: |
          set -e
          # `git status`, not `git diff`: it also reports an untracked file.
          if [ -z "$(git status --porcelain -- db/meta.db.json db/meta.pbe.json)" ]; then
            echo "Database is already up to date."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain -- db/meta.db.json)" ]; then
            PATCH=$(python3 -c "import json; db = json.load(open('db/meta.db.json')); print(db['versions'][-1]['patch'])")
            MESSAGE="chore: update meta db to patch ${PATCH}"
          else
            # Only the overlay moved: a new PBE build, or PBE and live are on
            # the same patch again.
            MESSAGE=$(python3 -c "import json; p = json.load(open('db/meta.pbe.json')); print('chore: remove the PBE preview' if p['build'] is None else 'chore: update PBE preview to %s.%s' % (p['patch'], p['build']))")
          fi
          git add db/meta.db.json db/meta.pbe.json
          git commit -m "${MESSAGE}"
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      # The push above is made with GITHUB_TOKEN, and GitHub does not raise
      # `push` events for those - so deploy.yml would never see this commit and
      # the new patch would sit in the repo, unpublished, until an unrelated
      # human push happened to carry it out. Trigger it by hand.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
